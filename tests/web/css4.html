<!doctype html><html><body style="font-family:sans-serif;background:#f4f4f4">
<h3>Rounded corners, gradients, translate</h3>
<div style="width:300px;padding:16px;background:#fff;border:1px solid #bbb;border-radius:12px">Card with a 12px radius and a border</div><br>
<div style="display:inline-block;padding:8px 20px;background:#e50914;color:#fff;border-radius:999px">Pill button</div>
<div style="display:inline-block;width:48px;height:48px;background:#06c;border-radius:50%"></div>
<div style="display:inline-block;padding:8px 14px;border:3px solid #093;border-radius:8px">Thick rounded border</div><br><br>
<div style="width:400px;height:50px;background:linear-gradient(to right,#f80,#08f);color:#fff">left to right</div>
<div style="width:400px;height:50px;background:linear-gradient(#222,#ccc);color:#fff">top to bottom</div>
<div style="width:400px;height:50px;background:#333"><div style="height:50px;background:linear-gradient(to right,rgba(255,255,0,0.9),transparent)">fades out to the right</div></div>
<div style="position:relative;width:400px;height:90px;background:#ddd;margin-top:10px">
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:6px 12px;border-radius:6px">Centred with translate</div>
</div>
</body></html>
