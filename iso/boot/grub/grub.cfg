set timeout=3
set default=0
insmod all_video
insmod gfxterm

menuentry "AXIOM" {
    multiboot2 /boot/thane.elf
    module2 /boot/initrd.tar initrd
    module2 /boot/thane.elf kernel
    module2 /boot/bootx64.efi bootx64
    module2 /boot/biosboot.img biosboot
    set gfxpayload=1920x1200x32,1920x1080x32,1920x800x32,1680x1050x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x800x32,1280x720x32,1024x768x32,auto
    boot
}
menuentry "AXIOM (safe graphics 1024x768)" {
    multiboot2 /boot/thane.elf
    module2 /boot/initrd.tar initrd
    module2 /boot/thane.elf kernel
    module2 /boot/bootx64.efi bootx64
    module2 /boot/biosboot.img biosboot
    set gfxpayload=1024x768x32,auto
    boot
}
