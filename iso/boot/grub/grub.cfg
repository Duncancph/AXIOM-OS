set timeout=3
set default=0
insmod all_video
insmod gfxterm

menuentry "DuncOS" {
    set gfxpayload=1280x800x32,1366x768x32,1280x720x32,1024x768x32,auto
    multiboot2 /boot/thane.elf
    module2 /boot/initrd.tar initrd
    boot
}
menuentry "DuncOS (safe graphics 1024x768)" {
    set gfxpayload=1024x768x32,auto
    multiboot2 /boot/thane.elf
    module2 /boot/initrd.tar initrd
    boot
}
