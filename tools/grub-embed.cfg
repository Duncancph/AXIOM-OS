# Built into the installed boot loader (BOOTX64.EFI): find the disk that has DuncOS, then use its menu.
search --no-floppy --set=root --file /duncos/thane.elf
if [ -n "$root" ]; then
    set prefix=($root)/duncos
    configfile ($root)/duncos/grub.cfg
fi
echo "DuncOS: no disk with /duncos/thane.elf was found."
sleep 10
